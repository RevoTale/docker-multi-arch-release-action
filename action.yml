name: RevoTale docker container multi-arch build & push action
description: Build and push multi-architecture Docker images
branding:
  icon: aperture
  color: green

inputs:
  registry:
    description: Container registry host, for example ghcr.io.
    required: true
  platforms:
    description: Comma-separated target platforms, for example linux/amd64,linux/arm64.
    required: true
  username:
    description: Container registry username.
    required: true
  file:
    description: Dockerfile path.
    required: false
  image-name:
    description: Image name without the registry prefix.
    required: true
  password:
    description: Container registry password or token.
    required: true
  context:
    description: Docker build context.
    required: false
    default: .
  tags:
    description: Custom docker/metadata-action tag rules. Defaults to ref-based tags.
    required: false
    default: |
      type=ref,event=branch
      type=ref,event=tag
      type=raw,value=latest,enable={{is_default_branch}}
  build-args:
    description: Build arguments passed to docker/build-push-action.
    required: false
    default: ''
  provenance:
    description: Provenance setting passed to docker/build-push-action. Empty uses its repository-aware default.
    required: false
    default: ''
  sbom:
    description: SBOM setting passed to docker/build-push-action.
    required: false
    default: 'false'
  verify-manifest:
    description: Verify every requested platform in every published image tag.
    required: false
    default: 'false'

outputs:
  digest:
    description: Digest of the published image or manifest list.
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Log in to the container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: ${{ inputs.tags }}

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ${{ inputs.context }}
        push: true
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom }}

    - name: Verify published image platforms
      if: ${{ inputs.verify-manifest == 'true' }}
      shell: bash
      env:
        IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        EXPECTED_PLATFORMS: ${{ inputs.platforms }}
      run: ${{ github.action_path }}/scripts/verify-manifest.sh
