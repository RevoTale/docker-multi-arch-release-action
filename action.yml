name: RevoTale docker container multi-arch build & push action
description: GitHub CI Action to simplify the process of building and pushing multi arch docker images
branding:
  icon: 'aperture'
  color: 'green'
inputs:
  registry: # For example: ghcr.io
    required: true
    type: string
  platforms: # Comma separated. For example: linux/amd64,linux/arm64
    required: true
    type: string
  username: # For example: github.actor
    required: true
    type: string
  file: # Dockerfile path
    required: false
    type: string
  image-name:
    required: true
    type: string
  password: # For example: secrets.GITHUB_TOKEN
    required: true
    type: string
  context:
    required: false
    type: string
    default: '.'
  tags:
    description: 'Custom tags (newline separated). If provided, overrides default branch-based tagging.'
    required: false
    default: |
      type=ref,event=branch
      type=ref,event=tag
      type=raw,value=latest,enable={{is_default_branch}}
  build-args:
    description: 'Build arguments to pass to docker/build-push-action (newline or comma separated).'
    required: false
    type: string
    default: ''
  provenance:
    description: 'Provenance attestation setting passed to docker/build-push-action. Leave empty to use its default.'
    required: false
    default: ''
  sbom:
    description: 'SBOM attestation setting passed to docker/build-push-action.'
    required: false
    default: 'false'
  verify-manifest:
    description: 'Inspect every published image tag after the build to verify that its manifest is readable.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
      -
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Uses the `docker/login-action` action to log in to the container registry.
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}
      # Extract tags and labels for the published image.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          push: true
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
      - name: Verify published image manifests
        if: ${{ inputs.verify-manifest == 'true' }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          verified=0
          while IFS= read -r image_tag; do
            if [[ -z "${image_tag}" ]]; then
              continue
            fi

            docker buildx imagetools inspect "${image_tag}"
            verified=1
          done <<< "${IMAGE_TAGS}"

          if [[ "${verified}" -ne 1 ]]; then
            echo "No published image tags were available to verify." >&2
            exit 1
          fi
